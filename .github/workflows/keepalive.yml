name: 24/7 Render Bot Keep-Alive & Deal Harvester

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mizodeals WhatsApp Bot
        run: |
          echo "Pinging Mizodeals WhatsApp Bot on Render..."
          curl -sS -m 25 https://mizodeals.com/api/bot > /dev/null || true
          echo "Bot keep-alive ping complete."

      - name: Harvest Fresh Daily Deals (Amazon & Myntra)
        run: |
          echo "Harvesting fresh daily loot deals..."
          curl -sS -m 35 "https://mizodeals.com/api/multi-scraper?autoPublish=true&source=amazon&limit=50" > /dev/null || true
          curl -sS -m 35 "https://mizodeals.com/api/multi-scraper?autoPublish=true&source=myntra&limit=40" > /dev/null || true
          echo "Daily deal scraping sync complete!"
